<div class="django-prose-editor-container">
  <lexxy-editor
    id="{{ widget.attrs.id }}"
    name="{{ widget.name }}"
    class="django-prose-lexxy"
    data-upload-attachment-url="{% url 'prose_upload_attachment' %}"
    {% if widget.value %}value="{{ widget.value }}"{% endif %}
    {% if widget.attrs.placeholder %}placeholder="{{ widget.attrs.placeholder }}"{% endif %}
  ></lexxy-editor>
</div>
