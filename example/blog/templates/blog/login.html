{% extends 'blog/base.html' %}

{% block title %}Sign in | Blog example | Django Prose{% endblock title %}

{% block content %}
<h1>Sign in</h1>
<p>Use your Django admin account or any user created in the admin.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock content %}
